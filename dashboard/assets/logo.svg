<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="58" r="45" fill="url(#glowGrad)" opacity="0.15" filter="blur(10px)"/>

  <!-- Outer Cyber Ring -->
  <circle cx="60" cy="58" r="48" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="60" cy="58" r="54" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 8" opacity="0.4"/>

  <!-- Shield Shape -->
  <path d="M 60 18 L 92 32 C 92 65 78 88 60 98 C 42 88 28 65 28 32 Z" 
        fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#shadowFilter)"/>

  <!-- Inner Shield Inset -->
  <path d="M 60 25 L 85 36 C 85 62 74 81 60 89 C 46 81 35 62 35 36 Z" 
        fill="#1E293B" stroke="url(#shieldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Cryptographic Circuit Nodes -->
  <line x1="60" y1="35" x2="60" y2="46" stroke="#06B6D4" stroke-width="2"/>
  <line x1="45" y1="52" x2="54" y2="52" stroke="#3B82F6" stroke-width="2"/>
  <line x1="66" y1="52" x2="75" y2="52" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="45" cy="52" r="2.5" fill="#06B6D4"/>
  <circle cx="75" cy="52" r="2.5" fill="#06B6D4"/>

  <!-- Keyhole / Core Lock Symbol -->
  <circle cx="60" cy="52" r="7" fill="url(#shieldGrad)"/>
  <path d="M 57 56 L 63 56 L 65 72 L 55 72 Z" fill="url(#shieldGrad)"/>
  <circle cx="60" cy="52" r="3.5" fill="#0F172A"/>
  <rect x="58.5" y="52" width="3" height="15" fill="#0F172A"/>

  <!-- Success Indicator Dot -->
  <circle cx="60" cy="85" r="2.5" fill="#10B981"/>
</svg>

